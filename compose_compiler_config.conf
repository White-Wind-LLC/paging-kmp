// Compose stability configuration for paging-kmp.
//
// `paging-core` is deliberately built without the Compose compiler plugin, so it carries no
// dependency on the Compose runtime and can be used from plain Kotlin. The Compose compiler only
// infers stability for classes it compiles itself, which means it treats every type coming out of
// this library as *unstable*: a composable taking a `PagingData` is never skippable and re-runs on
// every emission, whether or not anything it reads actually changed.
//
// Listing the types here tells the compiler otherwise. The claim holds: each of them is an
// immutable snapshot whose properties are `val`s fixed at construction, and the pagers publish a
// new instance for every state change rather than mutating the one already handed out.
//
// Copy this file into your own repository (the name and location are up to you) and point the
// Compose compiler at it from every module that consumes the pagers:
//
//     composeCompiler {
//         stabilityConfigurationFiles.add(
//             rootProject.layout.projectDirectory.file("compose_compiler_config.conf"),
//         )
//     }
//
// `<_>` marks the type parameter as not affecting stability, which is what makes the entry apply
// to `PagingData<YourItem>` for any item type. Your own item type still has to be stable in its
// own right for a list row to be skippable - which it usually is, being a `data class` of `val`s
// compiled by the plugin in your own module. A row type that is mutated in place is not covered by
// any of this, here no more than anywhere else in Compose.

ua.wwind.paging.core.PagingData<_>
ua.wwind.paging.core.PagingMap<_>
ua.wwind.paging.core.DataPortion<_>

ua.wwind.paging.core.LoadState
ua.wwind.paging.core.LoadState.Loading
ua.wwind.paging.core.LoadState.Success
ua.wwind.paging.core.LoadState.Error

// The sealed parent covers a parameter or a `remember` typed as `EntryState<T>`.
// `EntryState.Success` is deliberately left out: it carries an item of your element type, and
// whether that is safe to skip over is a question about your type, not about this library.
ua.wwind.paging.core.EntryState<_>
