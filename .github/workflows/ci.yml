name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  static-analysis:
    name: Static analysis
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Tune Gradle memory for CI runner
        run: |
          mkdir -p ~/.gradle
          {
            echo "org.gradle.jvmargs=-Xmx4g"
            echo "kotlin.daemon.jvmargs=-Xmx4g"
          } >> ~/.gradle/gradle.properties

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      # No ~/.konan cache: the standalone detekt task does not compile anything, so the
      # Kotlin/Native toolchain is never downloaded. That is what keeps this job fast enough
      # to report formatting problems long before the test jobs finish.
      # Runs without -PexcludeSamples on purpose: paging-samples is our code too.
      - name: Run Spotless and detekt
        run: ./gradlew spotlessCheck detekt

      - name: Upload analysis reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: static-analysis-reports
          path: '**/build/reports/detekt/**'
          retention-days: 7

  test-linux:
    name: Test (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Cache Kotlin/Native toolchain
        uses: actions/cache@v4
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: |
            konan-${{ runner.os }}-

      - name: Tune Gradle memory for CI runner
        run: |
          mkdir -p ~/.gradle
          {
            echo "org.gradle.jvmargs=-Xmx4g"
            echo "kotlin.daemon.jvmargs=-Xmx4g"
          } >> ~/.gradle/gradle.properties

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      # Runs on the full project on purpose: the committed lockfiles describe the
      # dependency graph with samples included, so verifying them requires the same graph.
      - name: Verify yarn lockfiles
        run: ./gradlew kotlinStoreYarnLock kotlinWasmStoreYarnLock

      # Lockfiles are already verified above; with -PexcludeSamples the generated lock is a
      # subset of the committed one, so the store tasks would always report a false mismatch.
      # spotlessCheck and detekt are excluded here: the dedicated static-analysis job already
      # runs them, on the full project including paging-samples.
      - name: Run checks
        run: >-
          ./gradlew -PexcludeSamples=true check
          -x kotlinStoreYarnLock -x kotlinWasmStoreYarnLock
          -x spotlessCheck -x detekt

      - name: Publish test report
        if: always()
        continue-on-error: true
        uses: mikepenz/action-junit-report@v5
        with:
          report_paths: '**/build/test-results/**/TEST-*.xml'
          check_name: Test results (Linux)
          detailed_summary: true
          include_passed: false
          fail_on_failure: false

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-linux
          path: |
            **/build/reports/tests/**
            **/build/test-results/**
          retention-days: 7

  test-apple:
    name: Test (Apple)
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Cache Kotlin/Native toolchain
        uses: actions/cache@v4
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: |
            konan-${{ runner.os }}-

      - name: Tune Gradle memory for CI runner
        run: |
          mkdir -p ~/.gradle
          {
            echo "org.gradle.jvmargs=-Xmx3g"
            echo "kotlin.daemon.jvmargs=-Xmx3g"
          } >> ~/.gradle/gradle.properties

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      # Apple targets only: jvm/js/wasm/linux are already covered by test-linux, and
      # iosX64/iosArm64 cannot execute tests on an arm64 runner, so they are compiled.
      - name: Run Apple target checks
        run: |
          ./gradlew -PexcludeSamples=true \
            :paging-core:macosArm64Test \
            :paging-core:iosSimulatorArm64Test \
            :paging-core:compileTestKotlinIosX64 \
            :paging-core:compileTestKotlinIosArm64

      - name: Publish test report
        if: always()
        continue-on-error: true
        uses: mikepenz/action-junit-report@v5
        with:
          report_paths: '**/build/test-results/**/TEST-*.xml'
          check_name: Test results (Apple)
          detailed_summary: true
          include_passed: false
          fail_on_failure: false

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-apple
          path: |
            **/build/reports/tests/**
            **/build/test-results/**
          retention-days: 7

  ci:
    name: CI
    if: always()
    needs: [static-analysis, test-linux, test-apple]
    runs-on: ubuntu-latest
    steps:
      - name: Verify required jobs succeeded
        run: |
          echo "static-analysis: ${{ needs.static-analysis.result }}"
          echo "test-linux: ${{ needs.test-linux.result }}"
          echo "test-apple: ${{ needs.test-apple.result }}"
          [ "${{ needs.static-analysis.result }}" = "success" ] || exit 1
          [ "${{ needs.test-linux.result }}" = "success" ] || exit 1
          [ "${{ needs.test-apple.result }}" = "success" ] || exit 1
